[project]
name = "bfsnodes"
description = "ComfyUI nodes for video workflows: SAM 3 segmentation and Molmo2 tracking; MiniMax H3 character swapping and sampling; shot planning and looping; LTX video controls and identity transfer; model loaders, LoRA tools, and image/video utilities."
version = "1.119.6"
license = {file = "LICENSE"}
dependencies = [
    "torch",
    "numpy",
    "Pillow",
    "safetensors",
    "librosa",
    "opencv-python",
    "scenedetect",
    "transformers>=4.55.0",
    "scipy",
]
